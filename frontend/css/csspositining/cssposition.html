<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
            display: flex;
            background-color: aliceblue;
            height: 2100px;
            align-items: flex-start;

        }

        .div1,
        .div2 {
            background-color: antiquewhite;
            height: 2000px;
            width: 300px;
            margin: 10px;
            display: flex
        }

        .h {
            position: sticky;
            top: 10px;
            background-color: blueviolet;
            height: 200px;
        }
    </style>
</head>

<body>

    <div class="parent">


        <div class="div1">
            <h1 class="h">Div1</h1>
        </div>
        <div class="div2">
            <h1 class="h">Div2</h1>
        </div>


    </div>


</body>

</html>
