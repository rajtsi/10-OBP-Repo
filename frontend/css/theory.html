<!-- Absolute Length Units

Fixed-size units that do not change based on screen size or parent elements. They are most useful for print design.
• cm — Centimeters (1cm = 37.8px)
• mm — Millimeters (1mm = 1/10th of 1cm)
• Q — Quarter-millimeters (1Q = 1/40th of 1cm)
• in — Inches (1in = 96px = 2.54cm)
• pc — Picas (1pc = 12pt = 1/6th of an inch)
• pt — Points (1pt = 1/72nd of an inch)
• px — Pixels (1px = 1/96th of an inch; device-relative for screens) -->



<!-- Font-Relative Units

• em — Relative to the font-size of the element (or parent element when used on font-size)
• rem — Relative to the font-size of the root (<html>) element

Viewport -->

Viewport-Percentage Units

• vw — 1% of the viewport's width
• vh — 1% of the viewport's height

• vmax — 1% of the viewport's larger dimension (width or height) -->
