<!-- 7. Mini Project

Student Registration Form
Combine labels, input types, dropdowns, radio buttons, checkboxes and validation -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <form>


        <label>
            Student Name
        </label>
        <input type="text" id="id1" placeholder="Enter Your Name" name="name">
        <br>
        
        <label>
            Student Roll Number
        </label>

        <input type="text" id="id2" name="roll">

        <br>
        <label>
            Course
        </label>
        <select id="c1" name="course">
            <option value="mern">MERN</option>
            <option value="ds">DS</option>
            <option value="da">DA</option>
        </select>
        <br>

        <label>
            18+
        </label>
        <input type="radio" id="id5">

        <br>
        <label>
            Did you cross checked all the details ?
        </label>
        <input type="checkbox" id="id5" required>


        <button type="submit">Submit</button>
    </form>

    </form>

</body>

</html>
