// 22 types that my input element can take

<!-- Text & Data Input

• text: The default single-line text input field.
• password: A text field that automatically masks characters (e.g., using dots or asterisks) for security.
• email: Intended for email addresses; provides automatic client-side format validation and optimized mobile keyboards.
• url: Used for web addresses; requires a valid URL format including the protocol (e.g., https://).
• tel: Specifically for telephone numbers; pulls up a numeric keypad on most touch devices.
• search: A text field styled specifically for search queries, often including a "clear" icon.
• number: Restricts the field to numerical input and often displays up/down spinner arrows.

Selection controls

• checkbox: A box that can be toggled on or off; allows selecting multiple options in a list.
• radio: A circular button used to select exactly one option out of a predefined group.
• range: A slider control used for selecting a number when the exact value is less precise.
• color: Displays a native color well that opens a system color picker when clicked.

Date & Time Pickers

• date: A control for entering a specific year, month, and day (no time).
• time: A control for entering a time value (hours, minutes, seconds) with no time zone.
• datetime-local: A combined control for choosing both a date and a time without a specific time zone.
• month: A picker restricted to a specific year and month (e.g., "January 2026").
• week: A picker restricted to a specific year and week number.

Buttons & Actions

• submit: Renders a button that automatically sends all the data in the form to the server.
• reset: Renders a button that resets all fields in the form back to their initial values.
• button: A general push button with no default behavior, intended to be programmed with JavaScript.
• image: Renders a graphical submit button using an image file specified by a src attribute.

Files & Specialized Types

• file: A control that allows the user to select and upload one or more files from their device storage.
• hidden: A form control that is not visible on the page, used to securely pass technical IDs or tokens during
submission. -->
